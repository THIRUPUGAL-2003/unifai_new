services:
  nginx:
    image: nginx:alpine
    container_name: unifai-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - unifai-1
      - unifai-2
      - unifai-3
    restart: unless-stopped

  unifai-1:
    image: unifai/unifai:latest
    container_name: unifai-1
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - unifai_data_1:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  unifai-2:
    image: unifai/unifai:latest
    container_name: unifai-2
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - unifai_data_2:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  unifai-3:
    image: unifai/unifai:latest
    container_name: unifai-3
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json:ro
      - unifai_data_3:/app/data
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  unifai_data_1:
  unifai_data_2:
  unifai_data_3:
