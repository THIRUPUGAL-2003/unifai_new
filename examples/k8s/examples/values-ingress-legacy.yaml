# Legacy ingress format — single Ingress resource named "<release>".
# Use this when you only need one ingress controller.
#
# Test with:
#   helm template unifai ../unifai/helm-charts/unifai -f values-ingress-legacy.yaml
#
image:
  repository: unifai/unifai
  tag: latest

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: unifai.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - unifai.example.com
      secretName: unifai-tls
