# Named ingress map format — one Ingress resource per key, named "<release>-<key>".
# Use this when you need multiple ingress controllers (e.g. public + internal).
#
# Test with:
#   helm template unifai ../unifai/helm-charts/unifai -f values-ingress-named.yaml
#
image:
  repository: unifai/unifai
  tag: latest

ingress:
  public:
    enabled: true
    className: nginx-public
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: unifai.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - unifai.example.com
        secretName: unifai-tls-public

  internal:
    enabled: true
    className: nginx-internal
    annotations: {}
    hosts:
      - host: unifai.internal.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
