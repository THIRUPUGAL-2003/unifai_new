storage:
  mode: postgres
  configStore:
    enabled: true
    type: postgres
  logsStore:
    enabled: true
    type: postgres
    objectStorage:
      enabled: true
      type: s3
      bucket: "unifai-logs"
      prefix: "unifai/logs"
      region: "us-east-1"
    objectStorageExcludeFields:
      - output_message

postgresql:
  enabled: true
  external:
    enabled: false
  auth:
    username: "unifai"
    password: "unifai"
    database: "unifai"
  primary:
    persistence:
      enabled: true
      size: 2Gi

# Prevent UnifAI from starting before Postgres is ready.
initContainers:
  - name: wait-for-postgresql
    image: postgres:16-alpine
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        until pg_isready -h "unifai-statefulset-upgrade-postgresql" -p 5432 -U "unifai"; do
          echo "waiting for postgresql..."
          sleep 2
        done
