# Prometheus configuration for tracking unifai-http service (for development and testing purposes only, don't use in production without proper setup)
global:
  scrape_interval: 5s # Scrape every 5 seconds

# Note: Target configuration depends on your deployment environment:
# - For local development: Use "host.docker.internal:8081" to access the service running on your host machine
# - For Docker deployment: Use "unifai-api:8081" to access the service within the Docker network
#   Make sure to replace "unifai-api" and "8081" with your actual docker container name and port if different
#   Also check that you have the unifai container inside "unifai_tracking_network".

scrape_configs:
  - job_name: "unifai-api"
    static_configs:
      - targets: ["host.docker.internal:8081"] # Scrape from the /metrics endpoint

