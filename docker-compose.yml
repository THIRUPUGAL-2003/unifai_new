services:
  # Employees: Guard EXE on each laptop (local :8085) AND/OR shared network proxy below.
  # Both report to the same Browser AI dashboard (Prompt Logs + Agents + shared rules).
  # Secrets and environment-specific hosts MUST come from .env — no hardcoded fallbacks.
  zen_gauss_v1:
    image: unifai-local:latest
    container_name: zen_gauss_v1
    env_file:
      - .env
    environment:
      - APP_DIR=${APP_DIR:-/app/data}
      - APP_PORT=${APP_PORT:-8081}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_STYLE=${LOG_STYLE:-json}
      - SERVER_DOMAIN=${SERVER_DOMAIN:?set SERVER_DOMAIN in .env}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:?set DB_HOST in .env}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:?set DB_NAME in .env}
      - DB_USER=${DB_USER:?set DB_USER in .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - BROWSER_AI_OLLAMA_URL=${OLLAMA_URL:?set OLLAMA_URL in .env}
      - OLLAMA_URL=${OLLAMA_URL:?set OLLAMA_URL in .env}
      - UNIFAI_COMPANY_NAME=${UNIFAI_COMPANY_NAME:-YesPanchi Group of Companies}
      - UNIFAI_COMPANY_LOGO=${UNIFAI_COMPANY_LOGO:-/yes-panchi-logo.png}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - 1panel-network
    ports:
      - "${APP_PORT:-8081}:${APP_PORT:-8081}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./apps/browser-guard/release:/app/release
      # Keep config.json inside ./data only. Do not also bind-mount a single file onto
      # /app/data/config.json — that breaks atomic rename saves (device or resource busy).
    restart: unless-stopped

  # Shared/network Guard proxy — same UnifAI Browser AI dashboard as laptop EXE.
  # Point office PAC/GPO to: https://<backend>/api/browser-ai/pac?proxy=<this-host>:8082
  unifai_broswer_proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: unifai_broswer_proxy
    command: mitmdump -s /app/proxy/browser_ai_proxy.py -p ${PROXY_PORT:-8082} --set listen_host=0.0.0.0 --set block_global=false --set ssl_insecure=true --set ignore_hosts='^(localhost|127\.0\.0\.1|zen_gauss_v1)'
    environment:
      - UNIFAI_BACKEND_URL=http://zen_gauss_v1:${APP_PORT:-8081}
      - UNIFAI_FAIL_OPEN=0
      - UNIFAI_SERVER_MODE=1
      - UNIFAI_AGENT_TYPE=network
      - UNIFAI_AGENT_ID=${UNIFAI_NETWORK_AGENT_ID:-network-proxy-1}
      - UNIFAI_AGENT_HOSTNAME=${UNIFAI_NETWORK_AGENT_HOSTNAME:-corp-network-proxy}
    ports:
      - "${PROXY_PORT:-8082}:${PROXY_PORT:-8082}"
    volumes:
      - ./apps/browser-guard/proxy:/app/proxy
    depends_on:
      - zen_gauss_v1
    restart: unless-stopped

networks:
  1panel-network:
    external: true
