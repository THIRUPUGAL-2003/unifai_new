version: '3.8'

services:
  # Production path for employees = Guard EXE on each laptop (local :8085) → this UnifAI backend.
  # browser_ai_proxy below is OPTIONAL lab/demo only — do not confuse with employee Guard.
  zen_gauss:
    image: unifai-local:latest
    container_name: zen_gauss
    environment:
      - APP_DIR=/app/data
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=info
      - LOG_STYLE=json
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    restart: unless-stopped

  # LAB ONLY: manual browser proxy to host:8087. Employee Guard EXE does NOT use this container.
  browser_ai_proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: unifai_browser_ai_proxy
    command: mitmdump -s /app/scripts/browser_ai_proxy.py -p 8087 --set listen_host=0.0.0.0 --set block_global=false --set ssl_insecure=true --set ignore_hosts='^(localhost|127\.0\.0\.1|zen_gauss)'
    environment:
      - UNIFAI_BACKEND_URL=http://zen_gauss:8080
      - UNIFAI_FAIL_OPEN=0
    ports:
      - "8087:8087"
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      - zen_gauss
    restart: unless-stopped
