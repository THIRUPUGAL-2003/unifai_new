services:
  # Production path for employees = Guard EXE on each laptop (local :8085) → this UnifAI backend.
  # unifai_broswer_proxy below is OPTIONAL lab/demo only — do not confuse with employee Guard.
  zen_gauss_v1:
    image: unifai-local:latest
    container_name: zen_gauss_v1
    environment:
      - APP_DIR=/app/data
      - APP_PORT=8081
      - APP_HOST=0.0.0.0
      - LOG_LEVEL=info
      - LOG_STYLE=json
      # AI Guard Bot → Ollama (1Panel container on shared network; code also auto-fallbacks).
      - BROWSER_AI_OLLAMA_URL=http://1Panel-ollama-IjuM:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - 1panel-network
    ports:
      - "8081:8081"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./configs/config.json:/app/data/config.json
    restart: unless-stopped

  # LAB ONLY: manual browser proxy to host:8082. Employee Guard EXE does NOT use this container.
  unifai_broswer_proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: unifai_broswer_proxy
    command: mitmdump -s /app/proxy/browser_ai_proxy.py -p 8082 --set listen_host=0.0.0.0 --set block_global=false --set ssl_insecure=true --set ignore_hosts='^(localhost|127\.0\.0\.1|zen_gauss_v1)'
    environment:
      - UNIFAI_BACKEND_URL=http://zen_gauss_v1:8081
      - UNIFAI_FAIL_OPEN=0
    ports:
      - "8082:8082"
    volumes:
      - ./apps/browser-guard/proxy:/app/proxy
    depends_on:
      - zen_gauss_v1
    restart: unless-stopped

networks:
  1panel-network:
    external: true
